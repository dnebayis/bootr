<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0000ff; }
      #root { position: relative; width: 100%; height: 100%; background: #0000ff; }
      #i1 { z-index: 1; } #i2 { z-index: 2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.6" data-width="1920" data-height="1080">
      <div id="i1" data-composition-id="i1" data-composition-src="compositions/i1-agent.html" data-start="0" data-duration="17" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="i2" data-composition-id="i2" data-composition-src="compositions/i2-end.html" data-start="16.9" data-duration="3.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music: catalog warm piano, 96 BPM, beat = 0.625 s. Swell on 10.0, hits on 15.0 and 17.5. Played once at rate 1. -->
      <audio id="bed" class="clip" src="assets/audio/bed-invite.wav" data-start="0" data-media-start="0" data-duration="20" data-volume="0.85" data-fade-in="0.03" data-fade-out="1" data-track-index="3" data-audio-group="music"></audio>

      <!-- Effects, peak-aligned one frame after their picture (generated by build.py). -->
      <audio id="sfx-w0" class="clip" src="assets/sfx/pop.mp3" data-start="0.018" data-duration="0.72" data-volume="0.5" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-wave-1" class="clip" src="assets/sfx/pop.mp3" data-start="2.418" data-duration="0.72" data-volume="0.55" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-line-1" class="clip" src="assets/sfx/key-press.mp3" data-start="2.493" data-duration="0.4" data-volume="0.45" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-wave-2" class="clip" src="assets/sfx/pop.mp3" data-start="4.293" data-duration="0.72" data-volume="0.55" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-line-2" class="clip" src="assets/sfx/key-press.mp3" data-start="4.368" data-duration="0.4" data-volume="0.45" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-wave-3" class="clip" src="assets/sfx/pop.mp3" data-start="6.168" data-duration="0.72" data-volume="0.55" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-line-3" class="clip" src="assets/sfx/key-press.mp3" data-start="6.243" data-duration="0.4" data-volume="0.45" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-wave-4" class="clip" src="assets/sfx/pop.mp3" data-start="8.043" data-duration="0.72" data-volume="0.55" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-line-4" class="clip" src="assets/sfx/key-press.mp3" data-start="8.118" data-duration="0.4" data-volume="0.45" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-ticker" class="clip" src="assets/sfx/key-press.mp3" data-start="8.538" data-duration="0.4" data-volume="0.6" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-door-in" class="clip" src="assets/sfx/whoosh.mp3" data-start="9.873" data-duration="0.575" data-volume="0.7" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-door-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="10.063" data-duration="1.2" data-fade-out="0.5" data-volume="0.55" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-tx" class="clip" src="assets/sfx/key-press.mp3" data-start="12.463" data-duration="0.4" data-volume="0.6" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-door-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="14.973" data-duration="0.575" data-volume="0.7" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-wake" class="clip" src="assets/sfx/pop.mp3" data-start="15.518" data-duration="0.72" data-volume="0.8" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="17.463" data-duration="1.6" data-fade-out="0.7" data-volume="0.7" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-word" class="clip" src="assets/sfx/key-press.mp3" data-start="18.013" data-duration="0.4" data-volume="0.5" data-track-index="5" data-audio-group="sfx"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
