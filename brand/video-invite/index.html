<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0000ff; }
      #root { position: relative; width: 100%; height: 100%; background: #0000ff; }
      #i1 { z-index: 1; } #i2 { z-index: 2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.4" data-width="1920" data-height="1080">
      <div id="i1" data-composition-id="i1" data-composition-src="compositions/i1-agent.html" data-start="0" data-duration="17" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="i2" data-composition-id="i2" data-composition-src="compositions/i2-end.html" data-start="16.85" data-duration="3.55" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music: catalog minimal tech beat, 110 BPM, beat = 60/110 s, cut to start on a downbeat. Low under the voice, up for the mark. -->
      <audio id="bed" class="clip" src="assets/audio/bed-groove.wav" data-start="0" data-media-start="0" data-duration="17.305" data-volume="0.34" data-fade-in="0.03" data-fade-out="0.15" data-track-index="3" data-audio-group="music"></audio>
      <audio id="bed-end" class="clip" src="assets/audio/bed-groove.wav" data-start="17.305" data-media-start="17.305" data-duration="3.095" data-volume="0.75" data-fade-in="0.15" data-fade-out="1" data-track-index="2" data-audio-group="music"></audio>

      <!-- The agent's voice: ElevenLabs "River", one clip a line. -->
      <audio id="v1" class="clip" src="assets/voice/v1.mp3" data-start="0.15" data-duration="1.254" data-volume="1" data-track-index="1" data-audio-group="voice"></audio>
      <audio id="v2" class="clip" src="assets/voice/v2.mp3" data-start="2.232" data-duration="1.3" data-volume="1" data-track-index="1" data-audio-group="voice"></audio>
      <audio id="v3" class="clip" src="assets/voice/v3.mp3" data-start="4.414" data-duration="1.718" data-volume="1" data-track-index="1" data-audio-group="voice"></audio>
      <audio id="v4" class="clip" src="assets/voice/v4.mp3" data-start="6.595" data-duration="1.161" data-volume="1" data-track-index="1" data-audio-group="voice"></audio>
      <audio id="v5" class="clip" src="assets/voice/v5.mp3" data-start="8.777" data-duration="1.115" data-volume="1" data-track-index="1" data-audio-group="voice"></audio>
      <audio id="v6" class="clip" src="assets/voice/v6.mp3" data-start="11.109" data-duration="3.111" data-volume="1" data-track-index="1" data-audio-group="voice"></audio>
      <audio id="v7" class="clip" src="assets/voice/v7.mp3" data-start="14.282" data-duration="1.022" data-volume="1" data-track-index="1" data-audio-group="voice"></audio>
      <audio id="v8" class="clip" src="assets/voice/v8.mp3" data-start="15.873" data-duration="0.836" data-volume="1" data-track-index="1" data-audio-group="voice"></audio>

      <!-- Effects, peak-aligned one frame after their picture (generated by build.py). -->
      <audio id="sfx-w0" class="clip" src="assets/sfx/pop.mp3" data-start="0.018" data-duration="0.72" data-volume="0.3" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-wave-1" class="clip" src="assets/sfx/pop.mp3" data-start="2.1" data-duration="0.72" data-volume="0.35" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-wave-2" class="clip" src="assets/sfx/pop.mp3" data-start="4.282" data-duration="0.72" data-volume="0.35" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-wave-3" class="clip" src="assets/sfx/pop.mp3" data-start="6.463" data-duration="0.72" data-volume="0.35" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-wave-4" class="clip" src="assets/sfx/pop.mp3" data-start="8.645" data-duration="0.72" data-volume="0.35" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-ticker" class="clip" src="assets/sfx/key-press.mp3" data-start="9.14" data-duration="0.4" data-volume="0.5" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-door-in" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.782" data-duration="0.575" data-volume="0.45" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-door-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="10.972" data-duration="1.0" data-fade-out="0.4" data-volume="0.4" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-door-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="15.246" data-duration="0.575" data-volume="0.5" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-wake" class="clip" src="assets/sfx/pop.mp3" data-start="15.791" data-duration="0.72" data-volume="0.5" data-track-index="5" data-audio-group="sfx"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="17.418" data-duration="1.6" data-fade-out="0.7" data-volume="0.55" data-track-index="4" data-audio-group="sfx"></audio>
      <audio id="sfx-word" class="clip" src="assets/sfx/key-press.mp3" data-start="17.968" data-duration="0.4" data-volume="0.5" data-track-index="5" data-audio-group="sfx"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
