    const B = 0.46985;
    const L = (k) => Math.round((k - 12) * B * 1000) / 1000;

    gsap.set("#r2-shake", { x: 0, y: 0 });
    gsap.set(["#r2-t1", "#r2-t2", "#r2-pool", "#r2-card", "#r2-tile", "#r2-lock", "#r2-tile-l"], { opacity: 0 });
    // Beat 12: the dark world opens out of the mark's centre.
    tl.fromTo("#r2-panel", { clipPath: "circle(0px at 384px 540px)" }, { clipPath: "circle(2000px at 384px 540px)", duration: 0.4, ease: "power2.inOut" }, 0);
    // Beat 13: the first title.
    tl.fromTo("#r2-t1", { x: -40, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, L(13));

    tl.fromTo("#r2-pool", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.35, ease: "power3.out" }, L(13.5));

    const o = { v: 0 };

    // Beat 18: the LP position card lands on the block. Beat 19: the locker tile pops in.

    tl.fromTo("#r2-tile", { scale: 0.8, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, L(19));
    // Beat 19.6-20: the title changes.
    tl.to("#r2-t1", { clipPath: "inset(0px 100% 0px 0px)", duration: 0.22, ease: "power3.in" }, L(19.6));
    tl.fromTo("#r2-t2", { x: -40, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, L(20));

    tl.to("#r2-card", { x: 706, y: 50, scale: 0.6, duration: 0.7, ease: "power3.inOut" }, L(21));
    tl.set("#r2-card", { opacity: 0 }, L(22.5));

    tl.set("#r2-lock", { opacity: 1 }, L(23));

    [[0.18, 7, -5], [0.213, -6, 4], [0.246, 4, -2], [0.28, 0, 0]].forEach(([d, x, y]) => tl.set("#r2-shake", { x, y }, L(23) + d));

    tl.fromTo("#r2-tile-l", { x: -40, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, L(24));
