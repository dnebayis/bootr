# Bootr on a single Coolify server (docs/deploy/coolify.md). One Postgres and the five services, pulled as
# images that GitHub Actions builds from the Dockerfiles under apps/* (.github/workflows/images.yml; the web
# bundle's NEXT_PUBLIC_* values are GitHub repository variables, not Coolify ones). Coolify reads this file as a "Docker Compose" application: every `${VAR}`
# becomes an environment variable in its UI (secrets are filled there, never here), `SERVICE_PASSWORD_*`
# values are generated by Coolify and `SERVICE_FQDN_<service>_<port>` carries the domain Coolify routes to
# that service through its Traefik proxy (set the hosts in the UI: bootr.fun, api.bootr.fun,
# indexer.bootr.fun). Services without a `SERVICE_FQDN` stay private on the compose network.
#
# Hostnames on the network are the service names below: sender:3002, inference:3003, indexer:42069,
# supervisor:3004, postgres:5432. Migrations run at container start (the Railway pre-deploy commands).
#
# Secrets stay with their service. Coolify writes every variable of the application into one `.env` and
# adds it as `env_file` to every service, so without help the public web process would hold the
# supervisor's keys. Each `command` below therefore starts with `env -u ...` that drops the secrets the
# service does not declare in its own `environment` block (the list is the union of the sensitive
# variables of all services). When a service gains a secret, add it to its block and remove it from its
# `-u` list; when a new secret appears anywhere, add `-u NAME` to every other service. The container config
# (and a `docker exec` shell) still holds the full `.env`; the main process (pid 1) is what is scoped, so
# verify through `/proc/1/environ`, not through `docker exec ... echo $VAR`.

x-restart: &restart
  restart: unless-stopped

# Memory ceilings per container (docs/deploy/coolify.md section 7). The CX33 has 7.6 GB usable; the six containers may
# take 5.5 GB together, which leaves about 2 GB for the OS, Docker, Coolify's proxy and Hermes. A container that passes
# its limit is killed and restarted by its `restart` policy instead of taking the box down with it; a hostile response
# or a leak costs one service a restart, nothing else.
services:
  postgres:
    <<: *restart
    mem_limit: 1g
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: bootr
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: bootr
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootr -d bootr"]
      interval: 10s
      timeout: 5s
      retries: 10

  sender:
    <<: *restart
    mem_limit: 512m
    # Built by GitHub Actions (.github/workflows/images.yml); IMAGE_TAG = a `sha-<commit>` tag to pin or roll back.
    image: ghcr.io/dnebayis/bootr-sender:${IMAGE_TAG:-main}
    pull_policy: always
    command: ["sh", "-c", "exec env -u BASE_RPC_URL -u BASE_RPC_FALLBACK_URL -u BUNDLER_URL -u PAYMASTER_URL -u ENABLE_MODE_BUNDLER_URL -u ENABLE_MODE_PAYMASTER_URL -u INFERENCE_RPC_URL -u ADMIN_CONSOLE_SLUG -u SEARCH_API_KEY -u TELEGRAM_BOT_TOKEN -u ADMIN_PRIVATE_KEY -u DEPLOYER_PRIVATE_KEY -u PLATFORM_TREASURY_PRIVATE_KEY -u BASESCAN_API_KEY -u SPENDER_MASTER_KEY -u SESSION_SIGNER_PRIVATE_KEY -u SUPERVISOR_SERVICE_KEY -u INDEXER_SERVICE_KEY -u OPENROUTER_API_KEY -u CDP_API_KEY_ID -u CDP_API_KEY_SECRET -u PINATA_JWT -u SESSION_SECRET -u SERVICE_PASSWORD_POSTGRES sh -c 'node dist/db/migrate.js && exec node dist/index.js'"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_FQDN_SENDER_3002: ${SERVICE_FQDN_SENDER_3002}
      PORT: "3002"
      # Behind Coolify's Traefik proxy: rate limits and OAuth redirects see the real client address.
      SENDER_TRUST_PROXY: "1"
      DATABASE_URL: postgres://bootr:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/bootr
      SENDER_SERVICE_KEY: ${SENDER_SERVICE_KEY}
      SENDER_ENCRYPTION_KEY: ${SENDER_ENCRYPTION_KEY}
      X_CLIENT_ID: ${X_CLIENT_ID}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET}
      X_REDIRECT_URI: ${X_REDIRECT_URI:-https://api.bootr.fun/oauth/callback}
      SENDER_OAUTH_RETURN_URL: ${SENDER_OAUTH_RETURN_URL:-https://bootr.fun/launch}
      SENDER_DEFAULT_POSTS_PER_DAY: ${SENDER_DEFAULT_POSTS_PER_DAY:-}
      SENDER_DEFAULT_MENTION_INTERVAL_SEC: ${SENDER_DEFAULT_MENTION_INTERVAL_SEC:-}
      # X reads per agent per UTC day (apps/sender/src/read-budget.ts); empty = 400, 0 = no budget.
      SENDER_DEFAULT_READS_PER_DAY: ${SENDER_DEFAULT_READS_PER_DAY:-}
      SENDER_SITE_URL: ${SENDER_SITE_URL:-}

  inference:
    <<: *restart
    mem_limit: 512m
    # Built by GitHub Actions (.github/workflows/images.yml); IMAGE_TAG = a `sha-<commit>` tag to pin or roll back.
    image: ghcr.io/dnebayis/bootr-inference:${IMAGE_TAG:-main}
    pull_policy: always
    command: ["sh", "-c", "exec env -u BASE_RPC_URL -u BASE_RPC_FALLBACK_URL -u BUNDLER_URL -u PAYMASTER_URL -u ENABLE_MODE_BUNDLER_URL -u ENABLE_MODE_PAYMASTER_URL -u ADMIN_CONSOLE_SLUG -u SEARCH_API_KEY -u TELEGRAM_BOT_TOKEN -u ADMIN_PRIVATE_KEY -u DEPLOYER_PRIVATE_KEY -u PLATFORM_TREASURY_PRIVATE_KEY -u BASESCAN_API_KEY -u SPENDER_MASTER_KEY -u SESSION_SIGNER_PRIVATE_KEY -u SUPERVISOR_SERVICE_KEY -u SENDER_SERVICE_KEY -u INDEXER_SERVICE_KEY -u X_CLIENT_SECRET -u SENDER_ENCRYPTION_KEY -u PINATA_JWT -u SESSION_SECRET -u SERVICE_PASSWORD_POSTGRES sh -c 'node scripts/migrate.mjs && exec node dist/main.js'"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3003"
      INFERENCE_PORT: "3003"
      DATABASE_URL: postgres://bootr:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/bootr
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CDP_API_KEY_ID: ${CDP_API_KEY_ID}
      CDP_API_KEY_SECRET: ${CDP_API_KEY_SECRET}
      INFERENCE_RPC_URL: ${INFERENCE_RPC_URL}
      X402_NETWORK: ${X402_NETWORK:-eip155:8453}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL}
      INFERENCE_PAYTO_ADDRESS: ${INFERENCE_PAYTO_ADDRESS}
      INFERENCE_PRICE_TABLE_JSON: ${INFERENCE_PRICE_TABLE_JSON:-}

  indexer:
    <<: *restart
    # Ponder holds its sync cache and reorg window in memory; a full resync is its hungriest hour.
    mem_limit: 1536m
    # Built by GitHub Actions (.github/workflows/images.yml); IMAGE_TAG = a `sha-<commit>` tag to pin or roll back.
    image: ghcr.io/dnebayis/bootr-indexer:${IMAGE_TAG:-main}
    pull_policy: always
    command: ["sh", "-c", "exec env -u BUNDLER_URL -u PAYMASTER_URL -u ENABLE_MODE_BUNDLER_URL -u ENABLE_MODE_PAYMASTER_URL -u INFERENCE_RPC_URL -u ADMIN_CONSOLE_SLUG -u SEARCH_API_KEY -u TELEGRAM_BOT_TOKEN -u ADMIN_PRIVATE_KEY -u DEPLOYER_PRIVATE_KEY -u PLATFORM_TREASURY_PRIVATE_KEY -u BASESCAN_API_KEY -u SPENDER_MASTER_KEY -u SESSION_SIGNER_PRIVATE_KEY -u SUPERVISOR_SERVICE_KEY -u SENDER_SERVICE_KEY -u X_CLIENT_SECRET -u SENDER_ENCRYPTION_KEY -u OPENROUTER_API_KEY -u CDP_API_KEY_ID -u CDP_API_KEY_SECRET -u PINATA_JWT -u SESSION_SECRET -u SERVICE_PASSWORD_POSTGRES sh scripts/start.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_FQDN_INDEXER_42069: ${SERVICE_FQDN_INDEXER_42069}
      PORT: "42069"
      INDEXER_DATABASE_URL: postgres://bootr:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/bootr
      # Fixed schema name: bump it whenever the indexing code changes (Ponder refuses to reuse a schema
      # built by another app version) and drop the old one with `ponder db prune`.
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-bootr_v1}
      CHAIN_ID: ${CHAIN_ID:-8453}
      BASE_RPC_URL: ${BASE_RPC_URL}
      INDEXER_SERVICE_KEY: ${INDEXER_SERVICE_KEY}
      # Every BootrLauncher ever used (`address@deployBlock,...`); empty = the single BOOTR_LAUNCHER_ADDRESS +
      # BOOTR_START_BLOCK pair. Adding one needs a DATABASE_SCHEMA bump (apps/indexer/README.md "Adding a launcher").
      BOOTR_LAUNCHERS: ${BOOTR_LAUNCHERS:-}
      BOOTR_LAUNCHER_ADDRESS: ${BOOTR_LAUNCHER_ADDRESS}
      BOOTR_GUARDIAN_ADDRESS: ${BOOTR_GUARDIAN_ADDRESS}
      BOOTR_START_BLOCK: ${BOOTR_START_BLOCK}
      RWAGMI_LAUNCHER_V3_ADDRESS: ${RWAGMI_LAUNCHER_V3_ADDRESS}
      RWAGMI_LOCKER_V3_ADDRESS: ${RWAGMI_LOCKER_V3_ADDRESS}
      RWAGMI_HOOK_V3_ADDRESS: ${RWAGMI_HOOK_V3_ADDRESS}
      RWAGMI_DEV_BUY_V3_ADDRESS: ${RWAGMI_DEV_BUY_V3_ADDRESS}
      BOOT_TOKEN_ADDRESS: ${BOOT_TOKEN_ADDRESS:-}
      INDEXER_CORS_ORIGIN: ${INDEXER_CORS_ORIGIN:-https://bootr.fun}
      ADMIN_CONFIG_URL: ${ADMIN_CONFIG_URL:-https://bootr.fun/api/admin/config}
      # Billing units per second Ponder may spend. Empty = 1300 on a CDP url (limit 1500, shared with the supervisor and
      # web), no budget elsewhere; 0 = no budget. No new DATABASE_SCHEMA needed (apps/indexer/rpc-budget.ts).
      INDEXER_RPC_BU_PER_SEC: ${INDEXER_RPC_BU_PER_SEC:-}
      # Optional second RPC for what the budget cannot cover and for what the first one answers 429 to. Indexer only.
      BASE_RPC_FALLBACK_URL: ${BASE_RPC_FALLBACK_URL:-}
      # Optional url for the block reads alone (eth_getBlockByNumber/ByHash, eth_blockNumber), outside the budget: the public
      # https://mainnet.base.org serves them and refuses eth_getLogs, so only blocks go there. Halves the keyed url's tail load.
      INDEXER_BLOCKS_RPC_URL: ${INDEXER_BLOCKS_RPC_URL:-}

  web:
    <<: *restart
    mem_limit: 1g
    # Built by GitHub Actions (.github/workflows/images.yml); IMAGE_TAG = a `sha-<commit>` tag to pin or roll back.
    image: ghcr.io/dnebayis/bootr-web:${IMAGE_TAG:-main}
    pull_policy: always
    command: ["sh", "-c", "exec env -u BASE_RPC_FALLBACK_URL -u BUNDLER_URL -u PAYMASTER_URL -u ENABLE_MODE_BUNDLER_URL -u ENABLE_MODE_PAYMASTER_URL -u INFERENCE_RPC_URL -u SEARCH_API_KEY -u TELEGRAM_BOT_TOKEN -u ADMIN_PRIVATE_KEY -u DEPLOYER_PRIVATE_KEY -u PLATFORM_TREASURY_PRIVATE_KEY -u BASESCAN_API_KEY -u SPENDER_MASTER_KEY -u SESSION_SIGNER_PRIVATE_KEY -u X_CLIENT_SECRET -u SENDER_ENCRYPTION_KEY -u OPENROUTER_API_KEY -u CDP_API_KEY_ID -u CDP_API_KEY_SECRET -u SERVICE_PASSWORD_POSTGRES node server.js"]
    depends_on:
      - indexer
      - sender
    environment:
      SERVICE_FQDN_WEB_3000: ${SERVICE_FQDN_WEB_3000}
      PORT: "3000"
      # The compose network is IPv4; the image default `::` is for Railway's IPv6 private network.
      HOSTNAME: 0.0.0.0
      SESSION_SECRET: ${SESSION_SECRET}
      SENDER_SERVICE_KEY: ${SENDER_SERVICE_KEY}
      INDEXER_SERVICE_KEY: ${INDEXER_SERVICE_KEY}
      BASE_RPC_URL: ${BASE_RPC_URL}
      ADMIN_CONSOLE_SLUG: ${ADMIN_CONSOLE_SLUG}
      ADMIN_ADDRESSES: ${ADMIN_ADDRESSES}
      # Pinata (image and metadata pinning from the launch form).
      PINATA_JWT: ${PINATA_JWT}
      SENDER_URL: http://sender:3002
      # The image model list and prices for the creator console are read server-side from the relay while pictures go
      # through it (BLOCKRUN_IMAGE_ROUTE unset or `relay`, the same setting as the supervisor's); minds come from the catalog.
      INFERENCE_URL: http://inference:3003
      BLOCKRUN_IMAGE_ROUTE: ${BLOCKRUN_IMAGE_ROUTE:-}
      # The coin page's agent config and activity (/api/agent/[kernel]/config, /activity) come from the supervisor's
      # internal API, signed with the key the supervisor also holds.
      SUPERVISOR_URL: http://supervisor:3004
      SUPERVISOR_SERVICE_KEY: ${SUPERVISOR_SERVICE_KEY}
      # Whose address the per-address limits count. Empty = X-Real-IP as Traefik sets it. `cloudflare` = the address
      # Cloudflare saw (CF-Connecting-IP): set it only once the origin firewall admits Cloudflare's ranges alone
      # (docs/deploy/coolify.md, "Cloudflare in front").
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
    volumes:
      # Admin config and launch drafts (docs/deploy/railway.md section 7). The image owns /data as `node`,
      # and a named volume inherits that ownership on first use.
      - web-data:/data

  supervisor:
    <<: *restart
    mem_limit: 1g
    # Built by GitHub Actions (.github/workflows/images.yml); IMAGE_TAG = a `sha-<commit>` tag to pin or roll back.
    image: ghcr.io/dnebayis/bootr-supervisor:${IMAGE_TAG:-main}
    pull_policy: always
    command: ["sh", "-c", "exec env -u BASE_RPC_FALLBACK_URL -u INFERENCE_RPC_URL -u ADMIN_CONSOLE_SLUG -u DEPLOYER_PRIVATE_KEY -u PLATFORM_TREASURY_PRIVATE_KEY -u BASESCAN_API_KEY -u X_CLIENT_SECRET -u SENDER_ENCRYPTION_KEY -u OPENROUTER_API_KEY -u CDP_API_KEY_ID -u CDP_API_KEY_SECRET -u PINATA_JWT -u SESSION_SECRET -u SERVICE_PASSWORD_POSTGRES sh -c 'node dist/db/migrate.js && exec node dist/index.js'"]
    # One replica only: the tick loop must not run twice.
    depends_on:
      postgres:
        condition: service_healthy
      sender:
        condition: service_started
      inference:
        condition: service_started
      indexer:
        condition: service_started
    environment:
      PORT: "3004"
      SUPERVISOR_PORT: "3004"
      DATABASE_URL: postgres://bootr:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/bootr
      SENDER_URL: http://sender:3002
      INFERENCE_PROVIDER_URL: http://inference:3003
      INDEXER_URL: http://indexer:42069
      CHAIN_ID: ${CHAIN_ID:-8453}
      BASE_RPC_URL: ${BASE_RPC_URL}
      BUNDLER_URL: ${BUNDLER_URL}
      PAYMASTER_URL: ""
      ENABLE_MODE_BUNDLER_URL: ${ENABLE_MODE_BUNDLER_URL:-}
      ENABLE_MODE_PAYMASTER_URL: ${ENABLE_MODE_PAYMASTER_URL:-}
      ENABLE_MODE_SELF_BUNDLE: ${ENABLE_MODE_SELF_BUNDLE:-true}
      GAS_MIN_WEI: ${GAS_MIN_WEI:-200000000000000}
      GAS_TARGET_WEI: ${GAS_TARGET_WEI:-1000000000000000}
      SESSION_SIGNER_PRIVATE_KEY: ${SESSION_SIGNER_PRIVATE_KEY}
      SPENDER_MASTER_KEY: ${SPENDER_MASTER_KEY}
      ADMIN_PRIVATE_KEY: ${ADMIN_PRIVATE_KEY}
      SENDER_SERVICE_KEY: ${SENDER_SERVICE_KEY}
      INDEXER_SERVICE_KEY: ${INDEXER_SERVICE_KEY}
      SUPERVISOR_SERVICE_KEY: ${SUPERVISOR_SERVICE_KEY}
      # Web research power: Brave Search API (https://api.search.brave.com/res/v1/web/search + the subscription token).
      # Empty = the search tool reports itself unavailable. The key is supervisor-only (other services strip it).
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_API_URL: ${SEARCH_API_URL:-}
      # Creator notifications over Telegram (a bot made with BotFather). Empty = only the console inbox works. Supervisor-only.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOOTR_LAUNCHER_ADDRESS: ${BOOTR_LAUNCHER_ADDRESS}
      BOOTR_GUARDIAN_ADDRESS: ${BOOTR_GUARDIAN_ADDRESS}
      LAUNCHER_START_BLOCK: ${LAUNCHER_START_BLOCK}
      RWAGMI_LAUNCHER_V3_ADDRESS: ${RWAGMI_LAUNCHER_V3_ADDRESS}
      RWAGMI_LOCKER_V3_ADDRESS: ${RWAGMI_LOCKER_V3_ADDRESS}
      INFERENCE_PAYTO_ADDRESS: ${INFERENCE_PAYTO_ADDRESS}
      # Direct mode (apps/supervisor/src/blockrun.ts). No secret: the spender signs, so no `-u` list changes.
      BLOCKRUN_DIRECT_MODE: ${BLOCKRUN_DIRECT_MODE:-}
      BLOCKRUN_DIRECT_AGENTS: ${BLOCKRUN_DIRECT_AGENTS:-}
      BLOCKRUN_BASE_URL: ${BLOCKRUN_BASE_URL:-}
      BLOCKRUN_PAYTO_ADDRESS: ${BLOCKRUN_PAYTO_ADDRESS:-}
      BLOCKRUN_ALLOW_EXACT: ${BLOCKRUN_ALLOW_EXACT:-}
      BLOCKRUN_PROMPT_CACHE: ${BLOCKRUN_PROMPT_CACHE:-}
      BLOCKRUN_TIMEOUT_MS: ${BLOCKRUN_TIMEOUT_MS:-}
      BLOCKRUN_RELAY_FALLBACK: ${BLOCKRUN_RELAY_FALLBACK:-}
      # Where pictures are bought: unset = relay (OpenRouter stays funded for pictures), direct = BlockRun's image API. The web reads it too.
      BLOCKRUN_IMAGE_ROUTE: ${BLOCKRUN_IMAGE_ROUTE:-}
      BLOCKRUN_HOLD_MS: ${BLOCKRUN_HOLD_MS:-}
      BLOCKRUN_IMAGE_POLL_MS: ${BLOCKRUN_IMAGE_POLL_MS:-}
      INFERENCE_RETRY_OUTPUT_TOKENS: ${INFERENCE_RETRY_OUTPUT_TOKENS:-}
      # Ceiling on one agent tool call (apps/supervisor/src/broker/index.ts): 180 s, 60 s for reads. Not secrets.
      TOOL_TIMEOUT_MS: ${TOOL_TIMEOUT_MS:-}
      TOOL_READ_TIMEOUT_MS: ${TOOL_READ_TIMEOUT_MS:-}
      # Sleeping runtimes checked per tick in their own sweep (tick.ts); empty = MAX_AGENTS_PER_TICK.
      MAX_SLEEPING_PER_TICK: ${MAX_SLEEPING_PER_TICK:-}
      PLATFORM_TREASURY_ADDRESS: ${PLATFORM_TREASURY_ADDRESS}
      BUILDER_CODES_ENABLED: ${BUILDER_CODES_ENABLED:-}
      BUILDER_CODES_URL: ${BUILDER_CODES_URL:-}
      SWAP_SLIPPAGE_BPS: ${SWAP_SLIPPAGE_BPS:-}
      CHAINLINK_MAX_AGE_SECONDS: ${CHAINLINK_MAX_AGE_SECONDS:-}
      SESSION_GAS_ALLOWANCE_WEI: ${SESSION_GAS_ALLOWANCE_WEI:-}
      SESSION_USEROP_LIMIT: ${SESSION_USEROP_LIMIT:-}
      SESSION_USDC_TRANSFER_CAP: ${SESSION_USDC_TRANSFER_CAP:-}
      SESSION_USDC_WINDOW_SECONDS: ${SESSION_USDC_WINDOW_SECONDS:-}
      SPENDER_MIN_USDC: ${SPENDER_MIN_USDC:-}
      SPENDER_TARGET_USDC: ${SPENDER_TARGET_USDC:-}
      MENTION_AUTO_CLOSE_ENABLED: ${MENTION_AUTO_CLOSE_ENABLED:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  postgres-data:
  web-data:
